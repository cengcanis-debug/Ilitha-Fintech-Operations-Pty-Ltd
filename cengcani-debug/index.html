<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Sentinel Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #07111f, #0f2b4d);
        color: #f8fafc;
        min-height: 100vh;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem;
      }
      .card {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 1.25rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .summary-strip {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-top: 0.65rem;
      }
      .summary-item {
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        font-size: 0.9rem;
        white-space: nowrap;
        letter-spacing: 0.01em;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.95rem;
        border-radius: 999px;
        font-weight: 700;
        background: #0f766e;
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.25);
      }
      .status-pill.down {
        background: #b91c1c;
      }
      .status-pill.degraded {
        background: #b45309;
      }
      .status-pill.unknown {
        background: #475569;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .site {
        padding: 1rem;
        border-radius: 14px;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.2);
        transition: transform 0.2s ease, border-color 0.2s ease;
        line-height: 1.5;
      }
      .site:hover {
        transform: translateY(-2px);
        border-color: rgba(125, 211, 252, 0.45);
      }
      .site h3 {
        margin: 0 0 0.4rem;
      }
      .site a {
        color: #7dd3fc;
        text-decoration: none;
      }
      .site .tag {
        display: inline-block;
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        background: rgba(74, 222, 128, 0.16);
        color: #bbf7d0;
      }
      .site .tag.down {
        background: rgba(248, 113, 113, 0.16);
        color: #fecaca;
      }
      .empty-state {
        color: #cbd5e1;
        padding: 0.8rem 0;
        font-style: italic;
        opacity: 0.9;
      }
      .meta {
        color: #94a3b8;
        font-size: 0.95rem;
        margin-top: 0.3rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="hero">
          <div>
            <h1>Cloud Sentinel Dashboard</h1>
            <p>Real-time monitoring for the configured cloud endpoints.</p>
            <div class="summary-strip">
              <div class="summary-item" id="summary-total">Total: —</div>
              <div class="summary-item" id="summary-up">Up: —</div>
              <div class="summary-item" id="summary-down">Down: —</div>
            </div>
          </div>
          <div id="overall-status" class="status-pill">Loading…</div>
        </div>
        <p id="generated-at" class="meta">Waiting for latest report…</p>
        <div id="site-list" class="grid">
          <div class="empty-state">No status data loaded yet. The monitor will populate this view automatically.</div>
        </div>
      </section>
    </main>

    <script>
      async function loadStatus() {
        try {
          const response = await fetch('./status.json', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          const pill = document.getElementById('overall-status');
          const generated = document.getElementById('generated-at');
          const siteList = document.getElementById('site-list');
          const summaryTotal = document.getElementById('summary-total');
          const summaryUp = document.getElementById('summary-up');
          const summaryDown = document.getElementById('summary-down');

          const overall = (data.overall_status || 'unknown').toLowerCase();
          const summary = data.summary || {};
          const normalizedOverall = ['up', 'degraded', 'down', 'error', 'unknown'].includes(overall) ? overall : 'unknown';
          pill.textContent = normalizedOverall.toUpperCase();
          pill.className = 'status-pill ' + normalizedOverall;
          generated.textContent = 'Updated: ' + (data.generated_at || 'unknown');
          summaryTotal.textContent = `Total: ${summary.total ?? '—'}`;
          summaryUp.textContent = `Up: ${summary.up ?? '—'}`;
          summaryDown.textContent = `Down: ${summary.down ?? '—'}`;

          siteList.innerHTML = '';
          if (!Array.isArray(data.sites) || data.sites.length === 0) {
            siteList.innerHTML = '<div class="empty-state">No sites were reported yet.</div>';
          } else {
            (data.sites || []).forEach((site) => {
              const card = document.createElement('article');
              card.className = 'site';
              card.innerHTML = `
                <h3>${site.name}</h3>
                <p><a href="${site.url}" target="_blank" rel="noreferrer">${site.url}</a></p>
                <p><span class="tag ${site.status}">${(site.status || 'unknown').toUpperCase()}</span></p>
                <p><strong>HTTP:</strong> ${site.http_code ?? 'n/a'}</p>
                <p><code>${site.message || 'No message'}</code></p>
              `;
              siteList.appendChild(card);
            });
          }
        } catch (error) {
          document.getElementById('overall-status').textContent = 'ERROR';
          document.getElementById('overall-status').className = 'status-pill down';
          document.getElementById('generated-at').textContent = 'Unable to load status.json';
          console.error(error);
        }
      }

      loadStatus();
      setInterval(loadStatus, 60000);
    </script>
  </body>
</html>
